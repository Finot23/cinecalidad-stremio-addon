<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Cinecalidad + Real Debrid</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        h1 { margin-bottom: 10px; color: #1DD1A1; }
        p { color: #bbb; line-height: 1.6; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ddd; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #252525;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { border-color: #1DD1A1; outline: none; }

        button {
            background-color: #1DD1A1;
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover { background-color: #15a07b; transform: scale(1.02); }

        .help-text {
            font-size: 14px;
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #f4d03f; /* Color RD */
            text-align: left;
        }
        .help-text a { color: #f4d03f; text-decoration: none; font-weight: bold; }
        .help-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/rxb3rth/cinecalidad-stremio-addon/refs/heads/main/logo.png" alt="Logo" class="logo">
        <h1>Cinecalidad + Real Debrid</h1>
        <p>Disfruta del catálogo de Cinecalidad con la velocidad de descarga de Real-Debrid.</p>

        <div class="help-text">
            <strong>¿Dónde está mi Token?</strong><br>
            1. Ve a <a href="https://real-debrid.com/apitoken" target="_blank">real-debrid.com/apitoken</a><br>
            2. Copia el código que dice "Private Token".
        </div>

        <div class="input-group">
            <label for="apiKey">API Token de Real-Debrid</label>
            <input type="text" id="apiKey" placeholder="Pega tu token aquí (ej. F5A...)" autocomplete="off">
        </div>

        <button onclick="installAddon()">Instalar en Stremio</button>
    </div>

    <script>
        function installAddon() {
            const token = document.getElementById('apiKey').value.trim();
            
            if (!token) {
                alert("Por favor, introduce tu API Token.");
                return;
            }

            // Detectamos el entorno actual
            const host = window.location.host;
            const protocol = window.location.protocol;
            
            // Construimos la URL dinámica: /TOKEN/manifest.json
            // Usamos el protocolo 'stremio:' para forzar que se abra la app
            const finalUrl = `stremio://${host}/${token}/manifest.json`;

            window.location.href = finalUrl;
        }
    </script>
</body>
</html>
