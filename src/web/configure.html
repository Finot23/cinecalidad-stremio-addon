<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Cinecalidad + Real Debrid</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background-color: #2d2d2d; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 400px; text-align: center; }
        h1 { color: #1DD1A1; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 10px; margin-bottom: 1rem; border-radius: 5px; border: 1px solid #444; background: #333; color: #fff; box-sizing: border-box; }
        button { background-color: #1DD1A1; color: #1a1a1a; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: background 0.3s; }
        button:hover { background-color: #15a07b; }
        .disclaimer { font-size: 0.8rem; color: #aaa; margin-top: 1rem; }
        a { color: #1DD1A1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://raw.githubusercontent.com/rxb3rth/cinecalidad-stremio-addon/refs/heads/main/logo.png" width="64" alt="Logo">
        <h1>Configuración</h1>
        
        <p>Introduce tu API Token de Real-Debrid para activar descargas y streaming rápido.</p>

        <!-- Campo para el Token -->
        <input type="text" id="rdToken" placeholder="Pega tu API Token aquí (ej. AB12...)" required>

        <!-- Botón de Instalación -->
        <button onclick="installAddon()">Instalar en Stremio</button>
        
        <div class="disclaimer">
            <p>¿No tienes un token? Obtenlo en <a href="https://real-debrid.com/apitoken" target="_blank">Real-Debrid API</a> (Requiere Premium).</p>
        </div>
    </div>

    <script>
        function installAddon() {
            const token = document.getElementById('rdToken').value.trim();
            
            if (!token) {
                alert("Por favor, introduce un token válido.");
                return;
            }

            // Construir la URL dinámica: dominio.com/{token}/manifest.json
            const currentHost = window.location.host;
            const protocol = window.location.protocol;
            
            // Stremio usa el protocolo 'stremio://' para instalar
            // Si estamos en localhost usamos http, si no https (importante para producción)
            const installProtocol = protocol === 'https:' ? 'stremio:' : 'stremio:'; // Forzamos stremio:
            
            // Generar la URL final de instalación
            const installUrl = `${installProtocol}//${currentHost}/${token}/manifest.json`;

            // Redirigir para instalar
            window.location.href = installUrl;
        }
    </script>
</body>
</html>
